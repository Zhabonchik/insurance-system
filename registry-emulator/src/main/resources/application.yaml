spring:
  application:
    name: registry-emulator

  datasource:
    url: jdbc:postgresql://localhost:5432/registry_db
    username: admin
    password: admin_password

  jpa:
    hibernate:
      # Liquibase owns the schema; Hibernate only validates entity/table alignment.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  # Container listens on 8080; root compose maps host 8081 -> container 8080.
  # For IDE runs use SERVER_PORT=8081 to avoid clashing with insurance-service.
  port: ${SERVER_PORT:8080}
