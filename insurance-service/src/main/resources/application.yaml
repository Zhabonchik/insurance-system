spring:
  application:
    name: insurance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/insurance_db
    username: admin
    password: admin_password

  jpa:
    hibernate:
      # Liquibase owns the schema; Hibernate only validates entity/table alignment.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  security:
    oauth2:
      resourceserver:
        jwt:
          # Client-facing issuer: tokens minted at http://localhost:8082 carry this
          # exact iss claim, so validation must target it. Docker keeps this value but
          # overrides the JWKS location via ...JWK_SET_URI (container cannot reach
          # localhost:8082, see compose).
          issuer-uri: http://localhost:8082/realms/insurance-realm

server:
  port: ${SERVER_PORT:8080}

registry:
  emulator:
    base-url: ${REGISTRY_EMULATOR_URL:http://localhost:8081}
    register-path: ${REGISTRY_REGISTER_PATH:/api/registry/contracts}
    connect-timeout: 2s
    read-timeout: 5s

outbox:
  scheduler:
    enabled: true
    fixed-delay: 5s
    batch-size: 20
    # Max registry calls in flight; keep below the Hikari pool size.
    concurrency: 5
    # How long a PROCESSING row may stay claimed before it is reclaimed.
    lease-timeout: 30s
  retry:
    max-retries: 5
    base-delay: 2s
    max-delay: 5m